[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-mcp"
version = "0.1.0"
description = "Reviewed MCP adapters for existing portfolio engines"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
portfolio-mcp = "portfolio_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
