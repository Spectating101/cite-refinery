<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html{background:#f5f7f8}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.62;color:#1b2e3c;margin:0 auto;max-width:1120px;padding:42px 34px 80px}
h1{font-size:clamp(30px,4vw,48px);letter-spacing:-.045em;line-height:1.16;margin:0 0 10px;color:#102e43}
h1+p{font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:#617786;margin-bottom:34px}
h2{margin-top:42px;margin-bottom:10px;border-top:1px solid #d7e0e5;padding-top:22px;letter-spacing:-.025em;font-size:24px}
p{max-width:920px}
strong{font-weight:750}
body>p:nth-of-type(2),body>h2:first-of-type+p{font-size:17px;line-height:1.7;color:#2c4251}
a{color:#175f82;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
table{width:100%;border-collapse:collapse;background:white;box-shadow:0 2px 8px #20304408;border:1px solid #dce4e8;border-radius:8px;font-variant-numeric:tabular-nums;display:block;overflow-x:auto;font-size:13px}
thead{background:#ebf1f4}
th{font-size:12px;font-weight:800;color:#4b6475}
th,td{text-align:left;border-bottom:1px solid #e4eaee;padding:11px 14px;min-width:100px}
tbody tr:last-child td{border-bottom:none}
table th:nth-child(1),table td:nth-child(1){min-width:240px}
table th:nth-child(6),table td:nth-child(6){min-width:250px}
td:nth-child(2),td:nth-child(3),td:nth-child(4),td:nth-child(5){white-space:nowrap;text-align:right}
td:nth-child(6){font-size:12px}
ul{padding-left:22px}
li{margin:9px 0}
h2:last-of-type{margin-top:55px}
@media(max-width:700px){body{padding:24px 15px 50px}h1{font-size:32px}h2{font-size:21px}table{font-size:12px}th,td{padding:10px}}
</style>
