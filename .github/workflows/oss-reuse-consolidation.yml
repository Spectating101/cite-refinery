name: OSS reuse consolidation contracts and public source smoke

on:
  pull_request:
    paths:
      - "src/cite_refinery/external_reuse_bridge.py"
      - "src/cite_refinery/external_landscape_cli.py"
      - "tests/test_external_reuse_bridge_v1.py"
      - "research_materials/external_landscape/reuse_registry_v1.json"
      - "docs/OSS_REUSE_CONSOLIDATION_V1.md"
      - ".github/workflows/oss-reuse-consolidation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q src/cite_refinery/external_reuse_bridge.py
      - name: Run new reuse adapters and original registry tests
        run: |
          python -m unittest discover -s tests -p 'test_external_reuse_bridge_v1.py' -v
          python -m unittest discover -s tests -p 'test_external_reuse_registry.py' -v
          python -m unittest discover -s tests -p 'test_external_solution_sources.py' -v

  live-read-only-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Query two fixed anonymous public endpoints and preserve partial results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cite_refinery.external_reuse_bridge import consolidate_discovery
          result = consolidate_discovery("flood", sources=("science", "orkg"), limit=3,
                                         module_id="reuse-smoke-flood",
                                         module_title="Unverified flood research tools")
          # No graph mutations; emit no sensitive original text.
          review = {
             "schema": result["schema"],
             "status": result["status"],
             "provider_receipts": result["provider_receipts"],
             "provider_errors": result["provider_errors"],
             "candidate_count": len(result["records"]),
             "candidate_ids": [r["external_id"] for r in result["records"]],
             "candidate_labels": [r["label"] for r in result["records"]],
             "candidate_repository_urls": [r["metadata"].get("candidate_repository_url") for r in result["records"]],
             "candidate_node_count": len(result["candidate_packet"]["nodes"]),
             "accepted_claim_edges": result["accepted_claim_edges"],
             "promotion_authorized": result["promotion_authorized"],
             "source_note": "Provider errors mean unavailable, not no relevant projects.",
          }
          assert review["accepted_claim_edges"] == 0
          assert review["promotion_authorized"] is False
          Path("oss-reuse-live-smoke.json").write_text(json.dumps(review, indent=2)+"\n")
          print("OSS_REUSE_SOURCE_SMOKE", json.dumps(review, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oss-reuse-provider-availability-review
          path: oss-reuse-live-smoke.json
          if-no-files-found: error
          retention-days: 7
