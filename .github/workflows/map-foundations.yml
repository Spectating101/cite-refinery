name: Three-layer map foundations

on:
  pull_request:
    paths:
      - "src/cite_refinery/layer_foundations.py"
      - "src/cite_refinery/original_layer_source_audit.py"
      - "src/cite_refinery/nocturnal_public_atlas.py"
      - "src/cite_refinery/academic_evidence_atlas.py"
      - "src/cite_refinery/academic_original_depth_audit.py"
      - "src/cite_refinery/implementation_evidence_atlas.py"
      - "src/cite_refinery/implementation_original_code_audit.py"
      - "src/cite_refinery/implementation_original_function_trial.py"
      - "src/cite_refinery/implementation_original_lef_def_trial.py"
      - "src/cite_refinery/standalone_workspace.py"
      - "src/cite_refinery/semantic_integration_reality_audit.py"
      - "src/cite_refinery/three_map_capability_packet.py"
      - "tests/test_three_map_capability_packet_v1.py"
      - "src/cite_refinery/standalone_atlas_template.html"
      - "src/cite_refinery/investigation_cli.py"
      - "tests/test_layer_foundations_v1.py"
      - "tests/test_original_layer_source_audit_v1.py"
      - "tests/test_nocturnal_public_atlas_v1.py"
      - "tests/test_academic_evidence_atlas_v1.py"
      - "tests/test_academic_original_depth_audit_v1.py"
      - "tests/test_implementation_evidence_atlas_v1.py"
      - "tests/test_implementation_original_function_trial_v1.py"
      - "tests/test_implementation_original_lef_def_trial_v1.py"
      - "tests/test_standalone_workspace_pilot_v1.py"
      - "tests/test_semantic_integration_reality_audit_v1.py"
      - "research_materials/runtime_trials/open_corpus_20261020/**"
      - "research_materials/opportunity_atlas/**"
      - "research_materials/runtime_trials/richer_corpus_20261020/development_source_manifest.json"
      - "research_materials/runtime_trials/richer_corpus_20261020/frozen_split_receipt.json"
      - ".github/workflows/map-foundations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-foundations:
    name: Frozen-source integrity and standalone-map tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[server]"
      - name: Compile source
        run: python -m compileall -q src/cite_refinery/layer_foundations.py src/cite_refinery/investigation_cli.py src/cite_refinery/original_layer_source_audit.py src/cite_refinery/nocturnal_public_atlas.py src/cite_refinery/academic_evidence_atlas.py src/cite_refinery/academic_original_depth_audit.py src/cite_refinery/implementation_evidence_atlas.py src/cite_refinery/implementation_original_code_audit.py src/cite_refinery/implementation_original_function_trial.py src/cite_refinery/implementation_original_lef_def_trial.py src/cite_refinery/standalone_workspace.py src/cite_refinery/semantic_integration_reality_audit.py src/cite_refinery/three_map_capability_packet.py
      - name: Run all map-first source integrity tests
        run: python -m unittest discover -s tests -p 'test_layer_foundations_v1.py' -v
      - name: Run independent source-audit guardrail tests
        run: python -m unittest discover -s tests -p 'test_original_layer_source_audit_v1.py' -v
      - name: Test Nocturnal publication-gated Practical map projection
        run: python -m unittest discover -s tests -p 'test_nocturnal_public_atlas_v1.py' -v
      - name: Test 103-source Academic development map and sealed holdout
        run: python -m unittest discover -s tests -p 'test_academic_evidence_atlas_v1.py' -v
      - name: Test original publisher JATS source-structure audit
        run: python -m unittest discover -s tests -p 'test_academic_original_depth_audit_v1.py' -v
      - name: Test standalone Implementation source and scoped trial boundaries
        run: python -m unittest discover -s tests -p 'test_implementation_evidence_atlas_v1.py' -v
      - name: Test original-function source and prerecorded fixture integrity
        run: python -m unittest discover -s tests -p 'test_implementation_original_function_trial_v1.py' -v
      - name: Test separate original EDA LEF/DEF source-and-fixture receipts
        run: python -m unittest discover -s tests -p 'test_implementation_original_lef_def_trial_v1.py' -v
      - name: Test offline standalone research workspace across complete frozen map datasets
        run: python -m unittest discover -s tests -p 'test_standalone_workspace_pilot_v1.py' -v
      - name: Reality-check literal vs meaning-level retrieval and separate archived LLM claims
        run: python -m unittest discover -s tests -p 'test_semantic_integration_reality_audit_v1.py' -v
      - name: Test source-balanced three-map evaluation packets without inventing gold
        run: python -m unittest discover -s tests -p 'test_three_map_capability_packet_v1.py' -v
      - name: Build release wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir /tmp/cite-refinery-layer-foundations-wheel
      - name: Generate consolidated layer-map artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/layer-maps"
          python -m cite_refinery.layered_cli investigate map-foundations \
            --json-out "$RUNNER_TEMP/layer-maps/standalone_layer_foundations.json" \
            --markdown-out "$RUNNER_TEMP/layer-maps/standalone_layer_coverage.md" \
            --review-backlog-out "$RUNNER_TEMP/layer-maps/implementation_review_backlog.json"
          python -c 'import json,os; root=os.environ["RUNNER_TEMP"]+"/layer-maps/"; m=json.load(open(root+"standalone_layer_foundations.json")); b=json.load(open(root+"implementation_review_backlog.json")); assert len(m["layers"])==3 and m["cross_layer_edges_generated"]==0 and m["implementation"]["unique_repositories"]==1287 and b["model_or_human_review_completed"]==0 and b["sampled_pairs"]==88'
      - name: Index 103 frozen Academic development sources independently
        run: |
          python -m cite_refinery.layered_cli investigate map-foundations \
            --academic-development-manifest research_materials/runtime_trials/richer_corpus_20261020/development_source_manifest.json \
            --academic-split-receipt research_materials/runtime_trials/richer_corpus_20261020/frozen_split_receipt.json \
            --academic-atlas-out "$RUNNER_TEMP/layer-maps/academic_development_evidence_atlas.json" \
            --academic-review-backlog-out "$RUNNER_TEMP/layer-maps/academic_source_review_backlog.json" \
            --json-out "$RUNNER_TEMP/layer-maps/academic_development_combined_foundations.json" \
            --markdown-out "$RUNNER_TEMP/layer-maps/academic_development_coverage.md"
      - name: Inspect original Europe PMC article structure without rehosting XML
        run: |
          python -m cite_refinery.academic_original_depth_audit \
            --academic-atlas "$RUNNER_TEMP/layer-maps/academic_development_evidence_atlas.json" \
            --max-docs 8 \
            --out "$RUNNER_TEMP/layer-maps/original_europe_pmc_jats_structure_audit.json"
      - name: Attach evidence-bound original JATS structure checks
        run: |
          python -m cite_refinery.layered_cli investigate map-foundations \
            --academic-development-manifest research_materials/runtime_trials/richer_corpus_20261020/development_source_manifest.json \
            --academic-split-receipt research_materials/runtime_trials/richer_corpus_20261020/frozen_split_receipt.json \
            --academic-original-jats-audit "$RUNNER_TEMP/layer-maps/original_europe_pmc_jats_structure_audit.json" \
            --academic-atlas-out "$RUNNER_TEMP/layer-maps/academic_original_source_enriched_atlas.json" \
            --json-out "$RUNNER_TEMP/layer-maps/academic_original_source_enriched_foundations.json" \
            --markdown-out "$RUNNER_TEMP/layer-maps/academic_original_source_coverage.md"
          python -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/layer-maps/"; a=json.load(open(p+"academic_original_source_enriched_atlas.json")); r=json.load(open(p+"original_europe_pmc_jats_structure_audit.json")); assert r["sampled_count"]==8 and a["coverage"]["original_jats_source_ids_sampled"]==8 and a["coverage"]["original_public_jats_structure_inspected"]==r["original_structure_inspected"] and a["coverage"]["independently_validated_scientific_findings"]==0'
      - name: Original publisher and GitHub source identity audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m cite_refinery.original_layer_source_audit \
            --manifest research_materials/runtime_trials/open_corpus_20261020/source_manifest.json \
            --backlog "$RUNNER_TEMP/layer-maps/implementation_review_backlog.json" \
            --academic-out "$RUNNER_TEMP/layer-maps/academic_publisher_identity_audit.json" \
            --implementation-out "$RUNNER_TEMP/layer-maps/implementation_pinned_source_audit.json" \
            --max-academic 47 --max-repo-pairs 44
      - name: Inspect all 44 pinned original GitHub source trees and code fingerprints, no execution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m cite_refinery.implementation_original_code_audit \
            --original-implementation-audit "$RUNNER_TEMP/layer-maps/implementation_pinned_source_audit.json" \
            --max-repositories 44 \
            --out "$RUNNER_TEMP/layer-maps/implementation_original_code_structure_audit.json"
      - name: Fetch one manually reviewed original upstream source blob
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m cite_refinery.implementation_original_function_trial fetch \
            --original-code-audit "$RUNNER_TEMP/layer-maps/implementation_original_code_structure_audit.json" \
            --out-dir "$RUNNER_TEMP/original-reviewed-lexical"
      - name: Replay preregistered original-function synthetic fixtures (no token)
        run: |
          python -m cite_refinery.implementation_original_function_trial replay \
            --source-dir "$RUNNER_TEMP/original-reviewed-lexical" \
            --out "$RUNNER_TEMP/layer-maps/implementation_original_function_replay.json"
          python -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/layer-maps/implementation_original_function_replay.json"; r=json.load(open(p)); assert r["case_count"]==16 and r["source_checked_at_full_file_and_git_blob"] and r["original_upstream_python_executed"] and r["case_status_counts"].get("pass",0)==16 and not r["demonstrated_field_effect_or_real_user_benefit"] and not r["network_sandbox_isolation_proven"]'
      - name: Fetch pinned original LEF/DEF checker source without executing it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m cite_refinery.implementation_original_lef_def_trial fetch \
            --original-code-audit "$RUNNER_TEMP/layer-maps/implementation_original_code_structure_audit.json" \
            --out-dir "$RUNNER_TEMP/original-reviewed-lef"
      - name: Replay EDA parser against preregistered good and adverse LEF/DEF fixtures
        run: |
          python -m cite_refinery.implementation_original_lef_def_trial replay \
            --source-dir "$RUNNER_TEMP/original-reviewed-lef" \
            --out "$RUNNER_TEMP/layer-maps/implementation_original_lef_def_replay.json"
          python -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/layer-maps/implementation_original_lef_def_replay.json"; r=json.load(open(p)); fail=[x for x in r["cases"] if x["status"]=="fail"]; assert r["case_count"]==16 and r["original_program_functions_executed"] and len(fail)==1 and fail[0]["id"]=="design_comment_is_not_real_layer" and r["case_status_counts"].get("pass")==15 and not r["operational_reuse_approved"]'
      - name: Build standalone Implementation Atlas with real recorded probe defects
        run: |
          python -m cite_refinery.layered_cli investigate map-foundations \
            --academic-original-audit "$RUNNER_TEMP/layer-maps/academic_publisher_identity_audit.json" \
            --implementation-original-audit "$RUNNER_TEMP/layer-maps/implementation_pinned_source_audit.json" \
            --implementation-original-code-audit "$RUNNER_TEMP/layer-maps/implementation_original_code_structure_audit.json" \
            --implementation-component-trials research_materials/opportunity_atlas/functional_component_trials.json \
            --implementation-original-function-replay "$RUNNER_TEMP/layer-maps/implementation_original_function_replay.json" \
            --implementation-original-lef-def-replay "$RUNNER_TEMP/layer-maps/implementation_original_lef_def_replay.json" \
            --implementation-atlas-out "$RUNNER_TEMP/layer-maps/implementation_capability_evidence_atlas.json" \
            --implementation-execution-frontier-out "$RUNNER_TEMP/layer-maps/implementation_original_execution_frontier.json" \
            --json-out "$RUNNER_TEMP/layer-maps/implementation_deep_foundations.json" \
            --markdown-out "$RUNNER_TEMP/layer-maps/implementation_capability_coverage.md"
          python -c 'import os,json; p=os.environ["RUNNER_TEMP"]+"/layer-maps/"; a=json.load(open(p+"implementation_capability_evidence_atlas.json")); c=a["coverage"]; assert c["survey_repository_leads"]==1287 and c["original_pinned_modules_with_executed_fixture_receipts"]==2 and c["actual_original_function_fixtures_recorded"]==32 and c["actual_original_function_fixtures_passing"]==31 and c["actual_original_function_fixtures_failing"]==1 and c["individual_source_anchored_requirement_receipts"]==17 and c["historical_scoped_trial_assets"]==3 and c["historical_scoped_trial_assets_outside_survey"]==3 and c["historic_synthetic_or_static_case_status_counts"]=={"pass":6,"fail":7,"blocked":1,"not_tested":3} and c["live_operational_implementations_verified"]==0 and c["underconverted_assets_proven"]==0 and a["cross_layer_edges_generated"]==0 and json.load(open(p+"implementation_original_execution_frontier.json"))["execution_approved"]==0'
      - name: Publish enriched maps with independently observed source identities
        run: |
          python -m cite_refinery.layered_cli investigate map-foundations \
            --academic-original-audit "$RUNNER_TEMP/layer-maps/academic_publisher_identity_audit.json" \
            --implementation-original-audit "$RUNNER_TEMP/layer-maps/implementation_pinned_source_audit.json" \
            --json-out "$RUNNER_TEMP/layer-maps/enriched_standalone_layer_foundations.json" \
            --markdown-out "$RUNNER_TEMP/layer-maps/enriched_standalone_layer_coverage.md"
          python -c 'import json,os; root=os.environ["RUNNER_TEMP"]+"/layer-maps/"; m=json.load(open(root+"enriched_standalone_layer_foundations.json")); a=m["within_layer_original_source_audits"]; assert a["publisher_doi_identity_confirmed"]>0 and a["implementation_pinned_revision_and_root_checked"]>0; assert a["new_executable_implementation_assets_qualified"]==0 and a["cross_layer_edges_created"]==0'
      - name: Generate offline three-map research browser with source dossiers
        run: |
          python -m cite_refinery.standalone_workspace \
            --foundation "$RUNNER_TEMP/layer-maps/standalone_layer_foundations.json" \
            --academic "$RUNNER_TEMP/layer-maps/academic_original_source_enriched_atlas.json" \
            --implementation "$RUNNER_TEMP/layer-maps/implementation_capability_evidence_atlas.json" \
            --out-dir "$RUNNER_TEMP/layer-maps/standalone-research-pilot"
          python -c 'import json,os,pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"])/"layer-maps"/"standalone-research-pilot"; j=json.loads((root/"atlas.json").read_text()); assert j["record_count"]==1497 and j["by_layer"]=={"practical":57,"academic":150,"implementation":1290} and j["original_data"]["academic_sealed_holdout_not_imported"]==66 and j["original_data"]["implementation_original_modules_tested"]==2 and j["original_data"]["implementation_actual_original_fixture_failures"]==1 and not j["original_data"]["practical_public_nocturnal_attached"] and (root/"index.html").exists()'
      - name: Audit actual three-atlas semantic integration against ten paraphrase traps
        run: |
          python -m cite_refinery.semantic_integration_reality_audit \
            --pilot "$RUNNER_TEMP/layer-maps/standalone-research-pilot/atlas.json" \
            --archived-entailment research_materials/opportunity_atlas/semantic_entailment_diagnostic_results.json \
            --archived-semantic-queue research_materials/opportunity_atlas/academic_semantic_review_queue.json \
            --template src/cite_refinery/standalone_atlas_template.html \
            --workspace-source src/cite_refinery/standalone_workspace.py \
            --report-out "$RUNNER_TEMP/layer-maps/semantic_integration_reality_audit.json"
          python -c 'import os,json; p=os.environ["RUNNER_TEMP"]+"/layer-maps/semantic_integration_reality_audit.json"; r=json.load(open(p)); assert r["search"]["n_pairs"]==10 and r["search"]["literal_target_recall"]==10 and r["search"]["meaning_preserving_paraphrase_target_recall"]==0 and r["historic_model_diagnostic"]["archived_agreement_with_investigator_labels"]==23 and r["source_integrity"]["exact_same_original_urls_occurring_across_layers"]==6 and not r["readiness_gate_passed"]'
      - name: Freeze source-balanced three-map benchmark review queue
        run: |
          python -m cite_refinery.three_map_capability_packet \
            --pilot "$RUNNER_TEMP/layer-maps/standalone-research-pilot/atlas.json" \
            --out-dir "$RUNNER_TEMP/layer-maps/three-map-capability-packet"
          python - <<'PY'
          from pathlib import Path
          import json, os
          root=Path(os.environ["RUNNER_TEMP"])/"layer-maps"/"three-map-capability-packet"
          questions=json.loads((root/"questions.json").read_text())
          refs=json.loads((root/"reviewer-reference.json").read_text())
          assert len(questions["questions"])==120
          assert len(refs["anchors"])==120
          assert len({a["selected_source_card_id"] for a in refs["anchors"]})==60
          assert sum(x["literal_hit"] for x in refs["historical_development_pairs"])==10
          assert sum(x["paraphrase_hit"] for x in refs["historical_development_pairs"])==0
          assert refs["independent_answer_quality_gold_available"] is False
          assert refs["no_sealed_holdout_or_private_nocturnal_material_used"] is True
          PY
      - name: Upload inspectable standalone maps
        uses: actions/upload-artifact@v4
        with:
          name: cite-refinery-three-layer-foundations
          path: ${{ runner.temp }}/layer-maps/
          if-no-files-found: error
          retention-days: 7
