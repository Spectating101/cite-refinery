name: atlas-market-demand-offline

on:
  pull_request:
    paths:
      - "src/cite_refinery/market_demand_screen.py"
      - "src/cite_refinery/business_cli.py"
      - "tests/test_market_demand_screen_v1.py"
      - "research_materials/opportunity_conversion/public_demand_scan_20261024.json"
      - ".github/workflows/atlas-market-demand-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Test real public demand and negative revenue gates
        run: python -m unittest tests.test_market_demand_screen_v1 -v
      - name: Run actual integrated four-case + three-public-lead CLI
        run: |
          cite-refinery-business board --plan examples/atlas_business_workbench_demo_v1.json --demand-scan research_materials/opportunity_conversion/public_demand_scan_20261024.json --as-of 2026-10-24 --format json > /tmp/atlas_demand_screen.json
          python -c "import json;p=json.load(open('/tmp/atlas_demand_screen.json'));s=p['public_demand_screen'];assert len(s['leads'])==3;assert s['pursue_now_count']==0;assert s['verified_contract_count']==0;assert p['total']['reported_payment']=='0.00';print('Demand-screen receipt: 3 public leads, 0 verified buyers and 0 payments')"
