name: owner-review-handoff
on:
  push:
    branches: [prototype/owner-review-handoff-v0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          python -m pip install -e .
          python -m pip install 'playwright==1.58.0' 'jsonschema==4.25.1'
          python -m playwright install --with-deps chromium
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript and cross-language contract
        run: |
          node --check prototype/review.js
          node --check prototype/owner-review-contract.js
          python scripts/check_owner_review_contracts.py
      - name: Browser file and HTTP handoff, including CLI return
        run: python scripts/check_owner_review_browser.py --out /tmp/owner-review-proof/browser
      - name: Package reproducible source snapshot
        if: always()
        run: |
          mkdir -p /tmp/owner-review-proof
          git archive --format=zip HEAD -o /tmp/owner-review-proof/source.zip
          git rev-parse HEAD > /tmp/owner-review-proof/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-review-proof-${{ github.sha }}
          path: /tmp/owner-review-proof/
          retention-days: 7
