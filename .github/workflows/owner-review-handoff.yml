name: owner-review-handoff

on:
  push:
    branches: [prototype/owner-review-handoff-v0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baseline regression suite
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Package reproducible source snapshot
        run: |
          mkdir -p /tmp/owner-review-proof
          git archive --format=zip HEAD -o /tmp/owner-review-proof/source.zip
          git rev-parse HEAD > /tmp/owner-review-proof/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owner-review-source-${{ github.sha }}
          path: /tmp/owner-review-proof/
          retention-days: 7
