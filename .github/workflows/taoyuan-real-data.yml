name: taoyuan-real-data

on:
  push:
    branches:
      - prototype/taoyuan-real-data
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and analyze official Taoyuan open data
        run: python pilot/real_data/taoyuan_mobility_probe.py
      - name: Print empirical report
        run: |
          cat real-data-output/taoyuan-real-data-report.md
          echo "--- SUMMARY JSON ---"
          cat real-data-output/taoyuan-real-data-summary.json
      - name: Upload reproducible probe outputs
        uses: actions/upload-artifact@v4
        with:
          name: taoyuan-real-data-probe
          path: real-data-output/
          if-no-files-found: error
