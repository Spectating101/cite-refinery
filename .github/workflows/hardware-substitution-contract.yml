name: Hardware substitution contract

on:
  pull_request:
    paths:
      - "src/cite_refinery/hardware_substitution.py"
      - "scripts/*hardware_substitution*"
      - "examples/hardware_substitution/**"
      - "tests/test_hardware_substitution_contract.py"
      - ".github/workflows/hardware-substitution-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check artifact contracts (no CAD engine claims)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_hardware_substitution_contract.py -v
