name: legal-codex-benchmark

on:
  pull_request:
    paths:
      - 'src/cite_refinery/legal_codex_*.py'
      - 'examples/legal_codex_*.json'
      - 'tests/test_legal_codex*.py'
      - '.github/workflows/legal-codex-benchmark.yml'
  push:
    branches:
      - 'feature/legal-codex-benchmark-*'
    paths:
      - 'src/cite_refinery/legal_codex_*.py'
      - 'examples/legal_codex_*.json'
      - 'tests/test_legal_codex*.py'
      - '.github/workflows/legal-codex-benchmark.yml'

jobs:
  legal-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test legal benchmark and semantic graph integration
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_legal_codex*.py' -v
      - name: Generate unreviewed 011 comparative audit and candidate graph
        run: |
          PYTHONPATH=src python -m cite_refinery.legal_codex_comparative_audit \
            examples/legal_codex_comparative_audit_011.json \
            --output legal-codex-comparative-011-result.json \
            --packet legal-codex-comparative-011-graph.json
      - name: Upload bounded comparative audit output (not a published legal conclusion)
        uses: actions/upload-artifact@v4
        with:
          name: legal-codex-comparative-011-unreviewed
          path: |
            legal-codex-comparative-011-result.json
            legal-codex-comparative-011-graph.json
          if-no-files-found: error
          retention-days: 30
