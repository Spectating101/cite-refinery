name: legal-codex-benchmark

on:
  pull_request:
    paths:
      - 'src/cite_refinery/legal_codex_benchmark.py'
      - 'examples/legal_codex_benchmark_001.json'
      - 'tests/test_legal_codex_benchmark_001.py'
      - '.github/workflows/legal-codex-benchmark.yml'
  push:
    branches:
      - 'feature/legal-codex-benchmark-*'
    paths:
      - 'src/cite_refinery/legal_codex_benchmark.py'
      - 'examples/legal_codex_benchmark_001.json'
      - 'tests/test_legal_codex_benchmark_001.py'
      - '.github/workflows/legal-codex-benchmark.yml'

jobs:
  legal-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test legal benchmark and semantic graph integration
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_legal_codex_benchmark_001.py' -v
