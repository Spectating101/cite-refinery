name: Portfolio evidence decision and AI dossier gates

on:
  pull_request:
    paths:
      - "src/cite_refinery/portfolio_decision_eval.py"
      - "src/cite_refinery/portfolio_autonomous_dossier.py"
      - "src/cite_refinery/portfolio_cross_project.py"
      - "scripts/portfolio_local_cpu_smoke.py"
      - "src/cite_refinery/portfolio_dossier_diagnostics.py"
      - "tests/test_portfolio_dossier_diagnostics.py"
      - "src/cite_refinery/portfolio_atomic_tasks.py"
      - "tests/test_portfolio_atomic_tasks.py"
      - "scripts/portfolio_atomic_model.py"
      - "src/cite_refinery/portfolio_atomic_benchmark.py"
      - "tests/test_portfolio_atomic_benchmark.py"
      - "scripts/portfolio_calibration_pilot.py"
      - "tests/test_portfolio_calibration_pilot.py"
      - "tests/test_portfolio_decision_eval_v2.py"
      - "tests/test_portfolio_autonomous_dossier_v3.py"
      - "tests/test_portfolio_cross_project_v3.py"
      - ".github/workflows/portfolio-dossier-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundary-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile and execute both suites
        run: |
          python -m compileall -q src/cite_refinery/portfolio_decision_eval.py src/cite_refinery/portfolio_autonomous_dossier.py src/cite_refinery/portfolio_cross_project.py
          python -m unittest discover -s tests -p 'test_portfolio_decision_eval_v2.py' -v
          python -m unittest discover -s tests -p 'test_portfolio_autonomous_dossier_v3.py' -v
          python -m unittest discover -s tests -p 'test_portfolio_cross_project_v3.py' -v
          python -m unittest discover -s tests -p 'test_portfolio_dossier_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_portfolio_atomic_tasks.py' -v
          python -m unittest discover -s tests -p 'test_portfolio_atomic_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_portfolio_calibration_pilot.py' -v
      - name: Assert model API keys not needed for deterministic suite
        run: |
          python - <<'PY'
          from cite_refinery.portfolio_autonomous_dossier import DossierError, remote_openai_compatible
          try:
              remote_openai_compatible('test-model','http://insecure.example/v1/chat/completions')
          except DossierError as exc:
              assert 'HTTPS' in str(exc)
          else:
              raise AssertionError('Insecure endpoint accepted')
          print('SOURCE_SCOPE_TESTS_ONLY: no autonomous inference or model quality results')
          PY

  local-cpu-model-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public Atlas and local inference engine
        run: |
          python -m pip install -e .
          python -m pip install 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.49.0' sentencepiece
      - name: Actual open-weight local model inference on eight pinned public projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python scripts/portfolio_local_cpu_smoke.py
      - name: Generate and verify 32 atomic tasks from actual public Atlas source graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m cite_refinery.portfolio_public_dogfood --manifest research_materials/portfolio_dogfood/public_source_manifest_2026_10_23.json --out "$RUNNER_TEMP/atomic-source-receipt.json"
          python -m cite_refinery.portfolio_atomic_tasks --receipt "$RUNNER_TEMP/atomic-source-receipt.json" --out "$RUNNER_TEMP/atomic-tasks.json"
      - name: Execute all 32 atomic prompts with real CPU model
        env:
          ATOMIC_TASKS_PATH: ${{ runner.temp }}/atomic-tasks.json
          ATOMIC_ANSWERS_PATH: ${{ runner.temp }}/atomic-model-results.json
          HF_HUB_DISABLE_TELEMETRY: "1"
          OMP_NUM_THREADS: "2"
        run: |
          python scripts/portfolio_atomic_model.py
      - name: Evaluate model versus trivial no-AI baseline
        run: |
          python -m cite_refinery.portfolio_atomic_benchmark --tasks "$RUNNER_TEMP/atomic-tasks.json" --results "$RUNNER_TEMP/atomic-model-results.json" --out "$RUNNER_TEMP/atomic-baseline-audit.json"
      - name: Upload reproducible model output and validation errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-local-cpu-inference-smoke
          path: |
            ${{ runner.temp }}/portfolio-cpu-smoke.json
            ${{ runner.temp }}/atomic-tasks.json
            ${{ runner.temp }}/atomic-model-results.json
            ${{ runner.temp }}/atomic-baseline-audit.json
          if-no-files-found: warn
          retention-days: 7

  stronger-model-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual source Atlas and small CPU inference engine
        run: |
          python -m pip install -e .
          python -m pip install 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.49.0' sentencepiece
      - name: Test Qwen2.5-1.5B on eight mixed evidence questions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python scripts/portfolio_calibration_pilot.py --out "$RUNNER_TEMP/stronger-model-calibration.json"
      - name: Publish real model output, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stronger-model-source-calibration
          path: ${{ runner.temp }}/stronger-model-calibration.json
          if-no-files-found: warn
          retention-days: 7
