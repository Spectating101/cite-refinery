name: legal-codex-access-outcomes-019
on:
  push:
    branches: ['feature/legal-codex-benchmark-001']
    paths:
      - 'scripts/legal_codex_capture_019.py'
      - 'src/cite_refinery/legal_codex_access_outcomes*.py'
      - 'tests/test_legal_codex_access_outcomes_019.py'
      - '.github/workflows/legal-codex-access-outcomes-019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture public judicial and institutional documents
        run: python scripts/legal_codex_capture_019.py --output-dir evidence-019
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legal-codex-019-PUBLIC-SOURCES-NOT-PRIVATE-LOGS
          path: evidence-019
          retention-days: 30
          if-no-files-found: error
