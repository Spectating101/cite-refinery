name: portfolio control focused

on:
  push:
    branches:
      - 'feature/atlas-portfolio-control-20261102'
  pull_request:
    paths:
      - 'src/cite_refinery/portfolio_control.py'
      - 'src/cite_refinery/headless_mcp.py'
      - 'tests/test_portfolio_control.py'
      - 'pyproject.toml'
      - '.github/workflows/portfolio-control.yml'

jobs:
  portfolio-offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_portfolio_control.py' -v
      - run: python -m unittest discover -s tests -p 'test_development_steering.py' -v
      - run: python -m unittest discover -s tests -p 'test_headless_intelligence.py' -v
