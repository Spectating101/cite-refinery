name: atlas multisource discovery focused

on:
  push:
    branches:
      - 'feature/atlas-multisource-discovery-20261102'
  pull_request:
    paths:
      - 'src/cite_refinery/multi_source_discovery.py'
      - 'tests/test_multi_source_discovery.py'
      - 'src/cite_refinery/discovery_capability_review.py'
      - 'tests/test_discovery_capability_review.py'
      - 'src/cite_refinery/source_evidence_gate.py'
      - 'tests/test_source_evidence_gate.py'
      - 'src/cite_refinery/typed_capability_map.py'
      - 'tests/test_typed_capability_map.py'
      - 'tests/test_interop_benchmarks.py'
      - 'tests/test_interop_acceptance_002.py'
      - 'tests/test_real_pdf_operator_pilot.py'
      - 'tests/test_financial_source_cell_acceptance.py'
      - 'scripts/financial_source_cell_acceptance.py'
      - 'scripts/interop_multipage_benchmark.py'
      - 'scripts/interop_positional_benchmark.py'
      - 'scripts/interop_pdf_benchmark.py'
      - 'scripts/interop_warc_benchmark.py'
      - 'examples/discovery/**'
      - 'docs/MULTISOURCE_DISCOVERY_V1.md'
      - 'pyproject.toml'
      - '.github/workflows/multisource-discovery.yml'

jobs:
  offline-multisource:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_multi_source_discovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_discovery_capability_review.py' -v
      - run: python -m unittest discover -s tests -p 'test_source_evidence_gate.py' -v
      - run: python -m unittest discover -s tests -p 'test_typed_capability_map.py' -v
      - run: python -m unittest discover -s tests -p 'test_interop_benchmarks.py' -v
      - run: python -m unittest discover -s tests -p 'test_interop_acceptance_002.py' -v
      - run: python -m unittest discover -s tests -p 'test_real_pdf_operator_pilot.py' -v
      - run: python -m unittest discover -s tests -p 'test_financial_source_cell_acceptance.py' -v
      - run: python -m unittest discover -s tests -p 'test_headless_intelligence.py' -v
      - run: python -m unittest discover -s tests -p 'test_development_steering.py' -v
      # Synthetic, offline fixtures only. No provider crawling or account secrets in CI.
