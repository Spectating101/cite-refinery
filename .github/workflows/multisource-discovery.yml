name: atlas multisource discovery focused

on:
  push:
    branches:
      - 'feature/atlas-multisource-discovery-20261102'
  pull_request:
    paths:
      - 'src/cite_refinery/multi_source_discovery.py'
      - 'tests/test_multi_source_discovery.py'
      - 'src/cite_refinery/discovery_capability_review.py'
      - 'tests/test_discovery_capability_review.py'
      - 'src/cite_refinery/source_evidence_gate.py'
      - 'tests/test_source_evidence_gate.py'
      - 'src/cite_refinery/typed_capability_map.py'
      - 'tests/test_typed_capability_map.py'
      - 'tests/test_interop_benchmarks.py'
      - 'tests/test_interop_acceptance_002.py'
      - 'tests/test_real_pdf_operator_pilot.py'
      - 'tests/test_financial_source_cell_acceptance.py'
      - 'tests/test_original_pdf_word_witness.py'
      - 'tests/test_original_pdf_period_context.py'
      - 'tests/test_isolated_period_context_acceptance.py'
      - 'tests/test_real_pdf_footnote_ambiguity.py'
      - 'tests/test_heterogeneous_pdf_regression.py'
      - 'tests/test_operator_assisted_pdf_review.py'
      - 'tests/test_heterogeneous_partial_page_acceptance.py'
      - 'tests/test_blind_review_invitations.py'
      - 'tests/test_heterogeneous_source_cell_quality.py'
      - 'tests/test_manulife_sec_issuer_reconciliation.py'
      - 'scripts/manulife_sec_issuer_reconciliation.py'
      - 'examples/discovery/manulife_sec_issuer_reconciliation_oracle_20261103.json'
      - 'scripts/heterogeneous_source_cell_acceptance.py'
      - 'examples/discovery/heterogeneous_original_source_cell_oracle_20261103.json'
      - 'scripts/interop_partial_page_acceptance.py'
      - 'scripts/prepare_blind_pdf_review_invites.py'
      - 'scripts/interop_operator_review_acceptance.py'
      - 'scripts/interop_footnote_ambiguity_acceptance.py'
      - 'scripts/interop_period_context_acceptance.py'
      - 'scripts/interop_original_word_acceptance.py'
      - 'scripts/financial_source_cell_acceptance.py'
      - 'scripts/interop_multipage_benchmark.py'
      - 'scripts/interop_positional_benchmark.py'
      - 'scripts/interop_pdf_benchmark.py'
      - 'scripts/interop_warc_benchmark.py'
      - 'examples/discovery/**'
      - 'docs/MULTISOURCE_DISCOVERY_V1.md'
      - 'pyproject.toml'
      - '.github/workflows/multisource-discovery.yml'

jobs:
  offline-multisource:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_multi_source_discovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_discovery_capability_review.py' -v
      - run: python -m unittest discover -s tests -p 'test_source_evidence_gate.py' -v
      - run: python -m unittest discover -s tests -p 'test_typed_capability_map.py' -v
      - run: python -m unittest discover -s tests -p 'test_interop_benchmarks.py' -v
      - run: python -m unittest discover -s tests -p 'test_interop_acceptance_002.py' -v
      - run: python -m unittest discover -s tests -p 'test_real_pdf_operator_pilot.py' -v
      - run: python -m unittest discover -s tests -p 'test_financial_source_cell_acceptance.py' -v
      - run: python -m unittest discover -s tests -p 'test_original_pdf_word_witness.py' -v
      - run: python -m unittest discover -s tests -p 'test_original_pdf_period_context.py' -v
      - run: python -m unittest discover -s tests -p 'test_isolated_period_context_acceptance.py' -v
      - run: python -m unittest discover -s tests -p 'test_real_pdf_footnote_ambiguity.py' -v
      - run: python -m unittest discover -s tests -p 'test_heterogeneous_pdf_regression.py' -v
      - run: python -m unittest discover -s tests -p 'test_operator_assisted_pdf_review.py' -v
      - run: python -m unittest discover -s tests -p 'test_heterogeneous_partial_page_acceptance.py' -v
      - run: python -m unittest discover -s tests -p 'test_blind_review_invitations.py' -v
      - run: python -m unittest discover -s tests -p 'test_heterogeneous_source_cell_quality.py' -v
      - run: python -m unittest discover -s tests -p 'test_manulife_sec_issuer_reconciliation.py' -v
      - run: python -m unittest discover -s tests -p 'test_headless_intelligence.py' -v
      - run: python -m unittest discover -s tests -p 'test_development_steering.py' -v
      # Synthetic, offline fixtures only. No provider crawling or account secrets in CI.
