name: Flood-warning first opportunity evidence gate

on:
  pull_request:
    paths:
      - "src/cite_refinery/flood_evidence_dossier.py"
      - "tests/test_flood_evidence_dossier_v1.py"
      - "docs/FLOOD_WARNING_FIRST_OPPORTUNITY_DOSSIER_V1.md"
      - "research_materials/runtime_trials/cross_layer_20261020/flood_candidate.json"
      - "research_materials/opportunity_atlas/functional_component_trials.json"
      - "research_materials/opportunity_atlas/conversion_qualification_with_positive_and_negative_trials_v1.json"
      - ".github/workflows/flood-evidence-dossier.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flood-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scoped source artifacts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline original project
        run: python -m pip install -e .
      - name: Compile flood evidence builder
        run: python -m compileall -q src/cite_refinery/flood_evidence_dossier.py
      - name: Test authentic historic source receipts and intentional negative cases
        run: python -m unittest discover -s tests -p 'test_flood_evidence_dossier_v1.py' -v
      - name: Generate bounded original-source flood dossier
        run: |
          python -m cite_refinery.flood_evidence_dossier \
            --cross-layer-alignment research_materials/runtime_trials/cross_layer_20261020/flood_candidate.json \
            --functional-trials research_materials/opportunity_atlas/functional_component_trials.json \
            --conversion-queue research_materials/opportunity_atlas/conversion_qualification_with_positive_and_negative_trials_v1.json \
            --out "$RUNNER_TEMP/flood-opportunity.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"flood-opportunity.json").read_text())
          assert r["decision"]["status"]=="LAB_ONLY_FALSIFICATION_PRIORITY_NO_DEPLOYMENT_RECOMMENDATION"
          assert r["source_reconciliation"]["implementation"]["synthetic_test_counts"]=={"pass":3,"fail":2,"not_tested":1}
          assert r["decision"]["automatic_cross_layer_promotion"] is False
          assert r["decision"]["field_use_authorized"] is False
          assert len(r["framework"]["four_pillars"])==4
          assert len(r["alternative_candidates"])==3
          PY
      - name: Upload bounded evidence-only receipt
        uses: actions/upload-artifact@v4
        with:
          name: first-flood-opportunity-review-only
          path: ${{ runner.temp }}/flood-opportunity.json
          retention-days: 7
          if-no-files-found: error
