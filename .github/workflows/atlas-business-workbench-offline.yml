name: atlas-business-workbench-offline

on:
  pull_request:
    paths:
      - "src/cite_refinery/business_workbench.py"
      - "src/cite_refinery/business_cli.py"
      - "tests/test_business_workbench_v1.py"
      - "examples/atlas_business_workbench_demo_v1.json"
      - ".github/workflows/atlas-business-workbench-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  business-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core package without paid services
        run: python -m pip install -e .
      - name: Verify business board, evidence boundaries and private ledger
        run: python -m unittest tests.test_business_workbench_v1 -v
      - name: Run integrated casebook board without contact or payment
        run: |
          cite-refinery-business board --plan examples/atlas_business_workbench_demo_v1.json --format json > /tmp/atlas_business_board_demo.json
          python -c "import json; r=json.load(open('/tmp/atlas_business_board_demo.json')); assert len(r['opportunities'])==4; assert r['total']['reported_payment']=='0.00'; assert r['total']['validation_budget']=='4000.00'; assert all(x['buyer_stage'] in ('none','problem_signal','unverified_claim') for x in r['opportunities']); print('4 research-only business opportunities; zero independently verified income')"
