name: Portfolio MCP contract
on:
  pull_request:
    paths:
      - 'integrations/portfolio-mcp/**'
      - 'integrations/mcp/**'
      - '.github/workflows/portfolio-mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -e 'integrations/portfolio-mcp[dev]'
      - run: python -m pytest integrations/portfolio-mcp/tests -q
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
