name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Validate prototype JavaScript
        run: |
          node --check prototype/app.js
          node --check prototype/stage-map.js
      - name: Validate prototype, exchange, stage, governance, pilot, sourcing, and draft JSON
        run: |
          python -m json.tool prototype/problems.json > /dev/null
          python -m json.tool prototype/stage-profiles.json > /dev/null
          python -m json.tool examples/problem_packet.json > /dev/null
          python -m json.tool examples/problem_stage_profiles.json > /dev/null
          python -m json.tool examples/problem_governance_envelopes.json > /dev/null
          python -m json.tool schemas/problem-packet.v0.1.schema.json > /dev/null
          python -m json.tool schemas/problem-stages.v0.1.schema.json > /dev/null
          python -m json.tool schemas/problem-governance.v0.1.schema.json > /dev/null
          python -m json.tool pilot/candidate_signals.tw.v0.1.json > /dev/null
          python -m json.tool pilot/rubrics.v0.1.json > /dev/null
          python -m json.tool pilot/drafts/taoyuan-mobility.candidate.v0.1.json > /dev/null
          python - <<'PY'
          import json
          a = json.load(open('prototype/stage-profiles.json'))
          b = json.load(open('examples/problem_stage_profiles.json'))
          assert a == b, 'prototype and canonical stage-profile examples drifted'
          PY
      - name: Smoke Problem Commons candidate signal import
        run: |
          problem-commons --state /tmp/problem-commons.json signal-import pilot/candidate_signals.tw.v0.1.json --steward ci-curator > /tmp/signal-import.json
          problem-commons --state /tmp/problem-commons.json list > /tmp/problem-list.json
          problem-commons --state /tmp/problem-commons.json list --public > /tmp/public-list.json
          python -m json.tool /tmp/signal-import.json > /dev/null
          python -m json.tool /tmp/problem-list.json > /dev/null
          python -m json.tool /tmp/public-list.json > /dev/null
          python - <<'PY'
          import json
          assert len(json.load(open('/tmp/problem-list.json'))) == 3
          assert json.load(open('/tmp/public-list.json')) == []
          PY
      - name: Smoke staged problem-solving extension
        run: |
          problem-stages --state /tmp/problem-stages.json import examples/problem_stage_profiles.json > /tmp/stage-import.json
          problem-stages --state /tmp/problem-stages.json validate > /tmp/stage-validation.json
          problem-stages --state /tmp/problem-stages.json coverage problem:tw-animal-0042 > /tmp/stage-coverage.json
          problem-stages --state /tmp/problem-stages.json route problem:tw-animal-0042 p3 > /tmp/stage-route.json
          python -m json.tool /tmp/stage-import.json > /dev/null
          python -m json.tool /tmp/stage-validation.json > /dev/null
          python -m json.tool /tmp/stage-coverage.json > /dev/null
          python -m json.tool /tmp/stage-route.json > /dev/null
          python - <<'PY'
          import json
          validation = json.load(open('/tmp/stage-validation.json'))
          coverage = json.load(open('/tmp/stage-coverage.json'))
          route = json.load(open('/tmp/stage-route.json'))
          assert validation['valid'] is True
          assert coverage['profiles'] == 4
          assert route['requires_professional_authority'] is True
          assert any(row['system'] == 'public-good' for row in route['route_plan'])
          PY
      - name: Smoke Public-Good governance extension
        run: |
          problem-governance --state /tmp/problem-governance.json import examples/problem_governance_envelopes.json > /tmp/governance-import.json
          problem-governance --state /tmp/problem-governance.json validate --target review > /tmp/governance-review.json
          problem-governance --state /tmp/problem-governance.json validate --target test > /tmp/governance-test.json
          problem-governance --state /tmp/problem-governance.json validate --target deploy > /tmp/governance-deploy.json
          python -m json.tool /tmp/governance-import.json > /dev/null
          python -m json.tool /tmp/governance-review.json > /dev/null
          python -m json.tool /tmp/governance-test.json > /dev/null
          python -m json.tool /tmp/governance-deploy.json > /dev/null
          python - <<'PY'
          import json
          review = json.load(open('/tmp/governance-review.json'))
          test = json.load(open('/tmp/governance-test.json'))
          deploy = json.load(open('/tmp/governance-deploy.json'))
          assert review['valid'] is True
          assert test['valid'] is True
          assert deploy['valid'] is False
          assert all(any('authority' in b or 'passed test' in b for b in row['blockers']) for row in deploy['envelopes'])
          PY
      - name: Smoke pilot CLI
        run: |
          problem-pilot --state /tmp/problem-pilot.json report > /tmp/problem-pilot-report.json
          python -m json.tool /tmp/problem-pilot-report.json > /dev/null
