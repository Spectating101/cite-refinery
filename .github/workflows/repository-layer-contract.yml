name: Repository layer contracts

on:
  pull_request:
    paths:
      - "src/cite_refinery/repository_layer*.py"
      - "src/cite_refinery/semantic.py"
      - "src/cite_refinery/web_shell.py"
      - "research_materials/repository_layer/**"
      - "tests/test_repository_layer*.py"
      - ".github/workflows/repository-layer-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify independent inventory and native ingestion
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_repository_layer*.py' -v
          python -m unittest discover -s tests -p 'test_semantic_graph.py' -v
          python -m unittest discover -s tests -p 'test_repository_trend_bridge.py' -v
