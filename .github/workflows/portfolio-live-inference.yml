name: Live public portfolio dossiers (GitHub Models)

on:
  push:
    branches:
      - feature/portfolio-autonomous-dossier-v3
    paths:
      - ".github/workflows/portfolio-live-inference.yml"
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  public-model-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Live inference over exactly eight pinned PUBLIC source repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTFOLIO_MODEL_API_KEY: ${{ github.token }}
        run: |
          python -m cite_refinery.portfolio_public_dogfood \
            --manifest research_materials/portfolio_dogfood/public_source_manifest_2026_10_23.json \
            --out "$RUNNER_TEMP/public-atlas.json"
          python -m cite_refinery.portfolio_autonomous_dossier \
            --atlas-receipt "$RUNNER_TEMP/public-atlas.json" \
            --output "$RUNNER_TEMP/public-dossiers.json" \
            --model openai/gpt-4o-mini \
            --endpoint https://models.github.ai/inference/chat/completions \
            --allow-remote-inference
      - name: Verify public-only source and model receipt
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          receipt=json.loads((root/"public-atlas.json").read_text())
          dossiers=json.loads((root/"public-dossiers.json").read_text())
          assert receipt["private_repositories_included"] == 0
          assert dossiers["project_count"] == 8
          assert len(dossiers["dossiers"]) == 8
          assert all(d["decision_is_provisional"] for d in dossiers["dossiers"])
          print("LIVE_MODEL_DOSSIERS",json.dumps({
            "projects":dossiers["project_count"],
            "decisions":{d["repository"]:d["decision"] for d in dossiers["dossiers"]},
            "independent_entailment_verified":False
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: public-portfolio-live-model-dossiers
          path: |
            ${{ runner.temp }}/public-atlas.json
            ${{ runner.temp }}/public-dossiers.json
          retention-days: 7
