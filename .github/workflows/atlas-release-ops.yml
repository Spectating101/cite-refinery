name: Atlas release radar operations (offline)

on:
  pull_request:
    paths:
      - "scripts/atlas_release_monitor.py"
      - "tests/test_atlas_release_monitor.py"
      - "src/cite_refinery/github_release_export.py"
      - ".github/workflows/atlas-release-ops.yml"
  push:
    branches: ["ops/atlas-readonly-timer-20261115"]

jobs:
  offline-operations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[headless]"
      - run: PYTHONPATH=src:. python -m unittest discover -s tests -p 'test_atlas_release_monitor.py' -v
      - run: PYTHONPATH=src:. python -m unittest discover -s tests -p 'test_github_release_export.py' -v
