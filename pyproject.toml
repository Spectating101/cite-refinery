[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cite-refinery"
version = "0.24.0"
description = "Clustered three-layer semantic research mapping across practical evidence, academic knowledge, and program supply."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Spectating101"}]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27,<1"]
openalex = ["pyalex>=0.15"]
documents = ["docling>=2.70"]
paperqa = ["paper-qa>=5"]
lightrag = ["lightrag-hku>=1.4"]
provenance = ["prov>=2,<3"]
services = ["httpx>=0.27,<1"]
semantic_discovery = ["numpy>=1.26", "scikit-learn>=1.4", "sentence-transformers>=3", "requests>=2.31", "beautifulsoup4>=4.12"]
functional_probes = ["numpy>=1.24", "pandas>=2", "matplotlib>=3.7", "PyYAML>=6"]

[project.scripts]
cite-refinery = "cite_refinery.layered_cli:main"
cite-refinery-web = "cite_refinery.web_cli:main"
cite-refinery-private = "cite_refinery.hosted_cli:main"
cite-refinery-nocturnal = "cite_refinery.nocturnal_bridge_cli:main"
cite-refinery-cite = "cite_refinery.cite_literature_cli:main"
cite-refinery-ground = "cite_refinery.cite_grounding_cli:main"
cite-refinery-repos = "cite_refinery.repository_trend_cli:main"
cite-refinery-refinery = "cite_refinery.refinery_execution_cli:main"
cite-refinery-history = "cite_refinery.refinery_history_cli:main"
cite-refinery-evolution = "cite_refinery.capability_evolution_cli:main"
cite-refinery-github-signals = "cite_refinery.github_signals_cli:main"
cite-refinery-github-private = "cite_refinery.github_private_signals_cli:main"
cite-refinery-external = "cite_refinery.external_cli:main"
cite-refinery-llm = "cite_refinery.external_llm_cli:main"
cite-refinery-investigate = "cite_refinery.investigation_cli:main"
cite-refinery-adjudicate = "cite_refinery.investigation_adjudication_cli:main"
cite-refinery-repair = "cite_refinery.evidence_repair_cli:main"
cite-refinery-discriminate = "cite_refinery.discriminating_tests_cli:main"
cite-refinery-field-audit = "cite_refinery.field_observation_cli:main"
cite-refinery-field-repair = "cite_refinery.field_observation_repair:main"
cite-refinery-cross-domain-probe = "cite_refinery.cross_domain_probe_cli:main"
cite-refinery-corpus-map = "cite_refinery.open_corpus_cli:main"
cite-refinery-rich-corpus = "cite_refinery.richer_evidence_cli:main"
cite-refinery-topics = "cite_refinery.external_knowledge_cli:main"
cite-refinery-landscape = "cite_refinery.external_landscape_cli:main"
cite-refinery-stack = "cite_refinery.cross_layer_cli:main"
cite-refinery-opportunities = "cite_refinery.opportunity_cli:main"
cite-refinery-opportunity-match = "cite_refinery.opportunity_match_cli:main"
cite-refinery-wide-scan = "cite_refinery.opportunity_atlas_collect:main"
cite-refinery-ted-context = "cite_refinery.opportunity_atlas_ted:main"
cite-refinery-opportunity-atlas = "cite_refinery.opportunity_atlas:main"
cite-refinery-notice-details = "cite_refinery.opportunity_atlas_notice_details:main"
cite-refinery-source-bridge-input = "cite_refinery.opportunity_atlas_source_input:main"
cite-refinery-connected-atlas = "cite_refinery.opportunity_atlas_connected:main"
cite-refinery-primary-mechanisms = "cite_refinery.opportunity_mechanism_primary:main"
cite-refinery-merge-atlas-evidence = "cite_refinery.opportunity_atlas_union:main"
cite-refinery-three-layer = "cite_refinery.three_layer_projection:main"
cite-refinery-three-layer-native-packet = "cite_refinery.three_layer_native_ingest:main"
cite-refinery-entailment-diagnostic = "cite_refinery.semantic_entailment_diagnostic:main"
cite-refinery-mechanism-critic = "cite_refinery.cross_source_mechanism_critic:main"
cite-refinery-three-layer-semantic-review = "cite_refinery.three_layer_semantic_review:main"
cite-refinery-functional-probes = "cite_refinery.functional_component_probes:main"
cite-refinery-functional-overlay = "cite_refinery.functional_three_layer_overlay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cite_refinery = ["private_evolution_assets/*.html", "private_evolution_assets/*.css", "private_evolution_assets/*.js", "vendor/*.js", "vendor/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
