[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cite-refinery"
version = "0.7.0"
description = "Scale-aware problem-to-literature-to-solution orchestration with inspectable end-to-end authority gates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Spectating101"}]
dependencies = []

[project.scripts]
cite-refinery = "cite_refinery.layered_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
