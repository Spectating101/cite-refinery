[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cite-refinery"
version = "0.24.0"
description = "Clustered three-layer semantic research mapping across practical evidence, academic knowledge, and program supply."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Spectating101"}]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27,<1"]
openalex = ["pyalex>=0.15"]
documents = ["docling>=2.70"]
paperqa = ["paper-qa>=5"]
lightrag = ["lightrag-hku>=1.4"]
provenance = ["prov>=2,<3"]
services = ["httpx>=0.27,<1"]
semantic_discovery = ["numpy>=1.26", "scikit-learn>=1.4", "sentence-transformers>=3", "requests>=2.31", "beautifulsoup4>=4.12"]

[project.scripts]
cite-refinery = "cite_refinery.layered_cli:main"
cite-refinery-web = "cite_refinery.web_cli:main"
cite-refinery-private = "cite_refinery.hosted_cli:main"
cite-refinery-nocturnal = "cite_refinery.nocturnal_bridge_cli:main"
cite-refinery-cite = "cite_refinery.cite_literature_cli:main"
cite-refinery-ground = "cite_refinery.cite_grounding_cli:main"
cite-refinery-repos = "cite_refinery.repository_trend_cli:main"
cite-refinery-refinery = "cite_refinery.refinery_execution_cli:main"
cite-refinery-history = "cite_refinery.refinery_history_cli:main"
cite-refinery-evolution = "cite_refinery.capability_evolution_cli:main"
cite-refinery-github-signals = "cite_refinery.github_signals_cli:main"
cite-refinery-github-private = "cite_refinery.github_private_signals_cli:main"
cite-refinery-external = "cite_refinery.external_cli:main"
cite-refinery-llm = "cite_refinery.external_llm_cli:main"
cite-refinery-investigate = "cite_refinery.investigation_cli:main"
cite-refinery-adjudicate = "cite_refinery.investigation_adjudication_cli:main"
cite-refinery-repair = "cite_refinery.evidence_repair_cli:main"
cite-refinery-discriminate = "cite_refinery.discriminating_tests_cli:main"
cite-refinery-field-audit = "cite_refinery.field_observation_cli:main"
cite-refinery-field-repair = "cite_refinery.field_observation_repair:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cite_refinery = ["private_evolution_assets/*.html", "private_evolution_assets/*.css", "private_evolution_assets/*.js", "vendor/*.js", "vendor/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
